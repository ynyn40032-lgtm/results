<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نتائج فصلي</title>
<style>
  *{ box-sizing:border-box; }
  :root{ --navy:#0F2440; --gold:#C7963E; --cream:#FBF8F0; --line:#EAE1C7; --muted:#7C8A7E; --ok:#0F5132; --okbg:#DDF0E3; --bad:#A3312B; --badbg:#F6DCDA; }
  html,body{ margin:0; min-height:100%; }
  body{ background:var(--cream); color:var(--navy); font-family:'Cairo','Tajawal',system-ui,sans-serif; padding-bottom:env(safe-area-inset-bottom,0); }
  header{ background:linear-gradient(160deg,#0F2440,#1E3F66); color:#F4EFDC; padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px; border-bottom:3px solid var(--gold); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  header h1{ margin:0; font-size:20px; }
  header small{ display:block; font-size:12px; opacity:.8; direction:ltr; text-align:right; }
  #logoutBtn{ background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:999px; padding:8px 14px; font:inherit; font-size:13px; cursor:pointer; }
  main{ max-width:720px; margin:0 auto; padding:14px; }
  #login{ position:fixed; inset:0; z-index:10; background:linear-gradient(160deg,#0F2440,#1E3F66); display:flex; align-items:center; justify-content:center; padding:20px; }
  #login .box{ width:100%; max-width:360px; background:var(--cream); border-radius:20px; border-top:4px solid var(--gold); padding:24px 20px; text-align:center; }
  #login h2{ margin:0 0 4px; }
  #login p{ margin:0 0 16px; color:var(--muted); font-size:14px; }
  input{ width:100%; padding:12px; margin-bottom:10px; border:1.5px solid var(--line); border-radius:10px; font:inherit; font-size:16px; background:#fff; }
  .primary{ width:100%; padding:13px; background:var(--navy); color:#F4EFDC; border:0; border-radius:10px; font:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  .primary:disabled{ opacity:.6; }
  #loginMsg{ color:var(--bad); font-size:14px; min-height:20px; margin-top:10px; }
  #forgot{ color:#9C6F22; font-size:13px; }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; }
  .chip{ flex:0 0 auto; border:1.5px solid var(--line); background:#fff; color:var(--navy); border-radius:999px; padding:7px 14px; font:inherit; font-size:14px; cursor:pointer; white-space:nowrap; }
  .chip.on{ background:var(--navy); color:#F4EFDC; border-color:var(--navy); }
  .sum{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .sum div{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 4px; text-align:center; font-size:13px; color:var(--muted); }
  .sum b{ display:block; font-size:22px; color:var(--navy); }
  .sum .g b{ color:var(--ok); } .sum .r b{ color:var(--bad); }
  .cls{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
  .cls h3{ margin:0 0 6px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:17px; }
  .cls h3 span{ font-size:13px; font-weight:600; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); }
  .row .meta{ font-size:12px; color:var(--muted); margin-top:2px; line-height:1.6; }
  .row .note{ font-size:12.5px; margin-top:3px; background:#FFF8E6; border-radius:8px; padding:4px 8px; }
  .badge{ display:inline-block; border-radius:999px; padding:2px 10px; font-weight:700; font-size:13px; white-space:nowrap; }
  .badge.ok{ background:var(--okbg); color:var(--ok); } .badge.bad{ background:var(--badbg); color:var(--bad); }
  .score{ text-align:left; font-size:12px; color:var(--muted); }
  .new{ display:inline-block; background:var(--bad); color:#fff; border-radius:999px; font-size:11px; padding:0 7px; margin-inline-start:6px; }
  .empty{ text-align:center; color:var(--muted); padding:40px 10px; line-height:1.9; }
  .refresh{ text-align:center; margin:4px 0 14px; }
  .refresh button{ background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:6px 16px; font:inherit; font-size:13px; color:var(--navy); cursor:pointer; }
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h2>📖 نتائج فصلي</h2>
    <p>ادخلي بإيميلك لتشوفي اختبارات فصولك</p>
    <input id="em" type="email" dir="ltr" placeholder="الإيميل" autocomplete="username">
    <input id="pw" type="password" dir="ltr" placeholder="كلمة السر" autocomplete="current-password">
    <button id="loginBtn" class="primary" type="button">دخول</button>
    <div id="loginMsg"></div>
    <a id="forgot" href="#">نسيت كلمة السر؟</a>
  </div>
</div>

<header>
  <div><h1>📖 نتائج فصلي</h1><small id="who"></small></div>
  <button id="logoutBtn" type="button">خروج</button>
</header>

<main>
  <div id="chips" class="chips"></div>
  <div id="sum" class="sum"></div>
  <div id="list"></div>
  <div class="refresh"><button id="refreshBtn" type="button">🔄 تحديث</button></div>
</main>

<script>
/* ===== نسخة بدون مكتبة Firebase =====
   بتكلّم Firebase مباشرة (REST) فبتشتغل حتى لو الملف اتفتح من الواتساب كملف (content://)
   من غير استضافة. الجلسة بتتحفظ لو التخزين متاح، ولو لأ بتفضل في الذاكرة طول ما الصفحة مفتوحة. */
const API_KEY = "AIzaSyAjr3fKiGeWU2KOftf52eGogRD2OHq5mpo";
const PROJECT_ID = "quran-tests-645cd";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEEN_KEY = 'teacher:seen', SESS_KEY = 'teacher:session';
let seen = {}, results = [], filter = 'all', session = null, timer = null;
try{ seen = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; }catch(e){}

function authErr(e){
  const c = String((e && (e.code || e.message)) || '');
  if(/INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|INVALID_EMAIL|MISSING_PASSWORD/.test(c)) return 'الإيميل أو كلمة السر غير صحيحة';
  if(/TOO_MANY/.test(c)) return 'محاولات كتير، استني شوية وجرّبي تاني';
  if(/USER_DISABLED/.test(c)) return 'الحساب ده موقوف، كلّمي الإدارة';
  if(/Failed to fetch|NetworkError|Load failed/i.test(c)) return 'مفيش اتصال بالنت';
  return 'حصلت مشكلة، جرّبي تاني' + (c ? ' (' + c + ')' : '');
}

async function post(url, body, form){
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': form ? 'application/x-www-form-urlencoded' : 'application/json' },
    body: form ? new URLSearchParams(body).toString() : JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if(!r.ok){
    const m = (j.error && (j.error.message || j.error.status)) || ('HTTP ' + r.status);
    const e = new Error(m); e.code = m; e.status = r.status; throw e;
  }
  return j;
}

function saveSession(){ try{ session ? localStorage.setItem(SESS_KEY, JSON.stringify(session)) : localStorage.removeItem(SESS_KEY); }catch(e){} }

async function signIn(email, password){
  const j = await post('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + API_KEY,
    { email, password, returnSecureToken: true });
  session = { idToken: j.idToken, refreshToken: j.refreshToken, email: (j.email || email).toLowerCase(), exp: Date.now() + (Number(j.expiresIn) || 3600) * 1000 };
  saveSession();
}

async function refreshToken(){
  const j = await post('https://securetoken.googleapis.com/v1/token?key=' + API_KEY,
    { grant_type: 'refresh_token', refresh_token: session.refreshToken }, true);
  session.idToken = j.id_token; session.refreshToken = j.refresh_token;
  session.exp = Date.now() + (Number(j.expires_in) || 3600) * 1000;
  saveSession();
}

function fv(v){
  if(!v) return null;
  if('stringValue' in v) return v.stringValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v) return v.doubleValue;
  if('booleanValue' in v) return v.booleanValue;
  if('timestampValue' in v) return Date.parse(v.timestampValue);
  if('nullValue' in v) return null;
  if('arrayValue' in v) return ((v.arrayValue.values) || []).map(fv);
  if('mapValue' in v){ const o = {}; const f = v.mapValue.fields || {}; for(const k in f) o[k] = fv(f[k]); return o; }
  return null;
}

async function fetchResults(retried){
  if(!session) return;
  if(Date.now() > session.exp - 60000){ await refreshToken(); }
  const r = await fetch('https://firestore.googleapis.com/v1/projects/' + PROJECT_ID + '/databases/(default)/documents:runQuery', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.idToken },
    body: JSON.stringify({ structuredQuery: {
      from: [{ collectionId: 'classResults' }],
      where: { fieldFilter: { field: { fieldPath: 'ownerEmail' }, op: 'EQUAL', value: { stringValue: session.email } } }
    } })
  });
  if(r.status === 401 && !retried){ await refreshToken(); return fetchResults(true); }
  const j = await r.json().catch(() => null);
  if(!r.ok){
    const e = new Error((j && j[0] ? j[0].error : j && j.error || {}).status || ('HTTP ' + r.status));
    e.status = r.status; throw e;
  }
  results = (j || []).filter(x => x.document).map(x => {
    const o = {}; const f = x.document.fields || {};
    for(const k in f) o[k] = fv(f[k]);
    o.id = x.document.name.split('/').pop();
    return o;
  });
}

async function load(){
  try{
    await fetchResults();
    render();
  }catch(err){
    if(err && err.status === 401){ doLogout(); return; }
    $('list').innerHTML = '<div class="empty">⚠️ ماقدرتش أحمّل النتايج.<br>' +
      (err && err.status === 403 ? 'الصلاحيات في قاعدة البيانات مش مفعّلة للمعلمات بعد (اتأكدي من قواعد Firestore).' : 'اتأكدي من النت وجرّبي تاني.' + (err && err.message ? ' (' + esc(err.message) + ')' : '')) + '</div>';
  }
}

function startApp(){
  $('login').style.display = 'none';
  $('who').textContent = session.email || '';
  load();
  clearInterval(timer);
  timer = setInterval(() => { if(!document.hidden) load(); }, 30000);
}
function doLogout(){
  clearInterval(timer); session = null; saveSession(); results = [];
  $('list').innerHTML = ''; $('sum').innerHTML = ''; $('chips').innerHTML = '';
  $('pw').value = ''; $('loginMsg').textContent = '';
  $('login').style.display = 'flex';
}

$('loginBtn').onclick = async () => {
  const em = $('em').value.trim(), pw = $('pw').value;
  if(!em || !pw){ $('loginMsg').textContent = 'اكتبي الإيميل وكلمة السر'; return; }
  $('loginBtn').disabled = true; $('loginMsg').textContent = 'جاري الدخول...';
  try{ await signIn(em, pw); $('loginMsg').textContent = ''; startApp(); }
  catch(e){ $('loginMsg').textContent = authErr(e); }
  $('loginBtn').disabled = false;
};
$('forgot').onclick = async ev => {
  ev.preventDefault();
  const em = $('em').value.trim();
  if(!em){ $('loginMsg').textContent = 'اكتبي الإيميل الأول'; return; }
  try{
    await post('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=' + API_KEY, { requestType: 'PASSWORD_RESET', email: em });
    $('loginMsg').textContent = 'اتبعتلك رابط تغيير كلمة السر على الإيميل';
  }catch(e){ $('loginMsg').textContent = authErr(e); }
};
$('logoutBtn').onclick = doLogout;
$('refreshBtn').onclick = load;

// لو في جلسة محفوظة (التخزين شغال) نكمّل منها
(async () => {
  try{
    const s = JSON.parse(localStorage.getItem(SESS_KEY) || 'null');
    if(s && s.refreshToken){ session = s; await refreshToken(); startApp(); }
  }catch(e){ session = null; }
})();

function render(){
  const classes = [...new Set(results.map(r => r.className).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ar'));
  if(filter !== 'all' && !classes.includes(filter)) filter = 'all';

  $('chips').innerHTML = classes.length > 1
    ? ['all'].concat(classes).map(c => `<button type="button" class="chip ${c === filter ? 'on' : ''}" data-c="${esc(c)}">${c === 'all' ? 'كل فصولي' : esc(c)}</button>`).join('')
    : '';

  const shown = results.filter(r => filter === 'all' || r.className === filter);
  const ok = shown.filter(r => r.status === 'ناجح').length;
  $('sum').innerHTML = shown.length
    ? `<div><b>${shown.length}</b>اختبار</div><div class="g"><b>${ok}</b>ناجح</div><div class="r"><b>${shown.length - ok}</b>راسب</div>`
    : '';

  if(!shown.length){
    $('list').innerHTML = '<div class="empty">📭 مفيش اختبارات لفصولك لسه.<br>أول ما يتسجل اختبار لفصلك هيظهر هنا.</div>';
    return;
  }
  const by = {};
  shown.forEach(r => { (by[r.className] = by[r.className] || []).push(r); });
  $('list').innerHTML = Object.keys(by).sort((a, b) => a.localeCompare(b, 'ar')).map(cn => {
    const rows = by[cn].sort((a, b) => (b.ts || 0) - (a.ts || 0));
    const o = rows.filter(r => r.status === 'ناجح').length;
    return `<div class="cls"><h3><span style="font-size:17px">${esc(cn)}</span><span>✅ ${o} ناجح · ❌ ${rows.length - o} راسب</span></h3>` +
      rows.map(r => {
        const pass = r.status === 'ناجح';
        const label = r.gender === 'f' || r.gender === 'أنثى' || r.gender === 'بنت' ? (pass ? 'ناجحة' : 'راسبة') : (pass ? 'ناجح' : 'راسب');
        const isNew = !seen[r.id];
        const where = r.app === 'surah' ? 'سورة جديدة' : (r.testType || '');
        const part = [r.hizb !== '' && r.hizb != null ? 'حزب ' + r.hizb : '', r.rub ? 'ربع ' + r.rub : ''].filter(Boolean).join(' · ');
        return `<div class="row"><div>
            <b>${esc(r.student)}</b>${isNew ? '<span class="new">جديد</span>' : ''}
            <div class="meta">${esc(r.date || '')}${where ? ' · ' + esc(where) : ''}${part ? ' · ' + esc(part) : ''}${r.supervisorName ? ' · المختبِرة: ' + esc(r.supervisorName) : ''}${r.demotedTo ? ' · 🔻 اتنقل لـ ' + esc(r.demotedTo) : ''}</div>
            ${r.notes ? `<div class="note">📝 ${esc(r.notes)}</div>` : ''}
          </div>
          <div class="score"><span class="badge ${pass ? 'ok' : 'bad'}">${label}</span><div>${esc(r.grade)} · أخطاء ${esc(r.mistakes || 0)}</div></div></div>`;
      }).join('') + '</div>';
  }).join('');

  // علّمي اللي ظهر على إنه اتشاف
  setTimeout(() => {
    shown.forEach(r => { seen[r.id] = 1; });
    try{ localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); }catch(e){}
  }, 4000);
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  filter = b.dataset.c; render();
});
</script>
</body>
</html>
